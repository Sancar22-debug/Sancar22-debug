<svg xmlns="http://www.w3.org/2000/svg" width="600" height="120" font-family="monospace">
<style>
  @keyframes chomp_open {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }
  @keyframes chomp_closed {
    0%, 100% { opacity: 0; }
    50% { opacity: 1; }
  }
  @keyframes move_pacman {
    0% { transform: translateX(-150px); }
    100% { transform: translateX(650px); }
  }
  @keyframes move_ghost {
    0% { transform: translateX(-30px); }
    100% { transform: translateX(770px); }
  }
  .pacman { fill: #00ff9c; animation: move_pacman 5s linear infinite; }
  .pacman-open { animation: chomp_open 0.4s step-end infinite; }
  .pacman-closed { animation: chomp_closed 0.4s step-end infinite; }
  .ghost { fill: #ff5f56; animation: move_ghost 5s linear infinite; }
  .text { font-size: 16px; font-weight: bold; }
</style>

<g class="ghost text">
  <text x="0" y="30" xml:space="preserve">   ######   </text>
  <text x="0" y="45" xml:space="preserve"> ########## </text>
  <text x="0" y="60" xml:space="preserve"> ##OO##OO## </text>
  <text x="0" y="75" xml:space="preserve"> ########## </text>
  <text x="0" y="90" xml:space="preserve"> ##  ##  ## </text>
</g>

<g class="pacman text">
  <g class="pacman-open">
    <text x="0" y="30" xml:space="preserve">   ######   </text>
    <text x="0" y="45" xml:space="preserve"> ########## </text>
    <text x="0" y="60" xml:space="preserve"> ######     </text>
    <text x="0" y="75" xml:space="preserve"> ########## </text>
    <text x="0" y="90" xml:space="preserve">   ######   </text>
  </g>
  <g class="pacman-closed">
    <text x="0" y="30" xml:space="preserve">   ######   </text>
    <text x="0" y="45" xml:space="preserve"> ########## </text>
    <text x="0" y="60" xml:space="preserve"> ########## </text>
    <text x="0" y="75" xml:space="preserve"> ########## </text>
    <text x="0" y="90" xml:space="preserve">   ######   </text>
  </g>
</g>
</svg>
